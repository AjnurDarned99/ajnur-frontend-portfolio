<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeLog Demo</title><link rel="stylesheet" href="style.css"></head><body><header><a href="../../index.html">← Portfolio</a><h1>TradeLog <small>TRADING JOURNAL</small></h1></header><main><p class="eyebrow">REVIEW YOUR PROCESS</p><h2>Track the process.<br>Learn from the data.</h2><p class="muted">A practice journal for trade outcomes and R-multiples. Not financial advice.</p><section class="stats"><div>TRADES <b id="count">0</b></div><div>WIN RATE <b id="win">0%</b></div><div>NET RESULT <b id="net">0R</b></div><div>AVERAGE <b id="avg">0R</b></div></section><form id="form"><input name="market" required placeholder="Market e.g. XAUUSD"><input name="setup" required placeholder="Setup e.g. Breakout"><select name="outcome"><option>Win</option><option>Loss</option><option>Breakeven</option></select><input name="result" type="number" step=".1" required value="1.5" aria-label="Result in R"><button>Log trade</button></form><div class="filters"><select id="filter"><option value="all">All outcomes</option><option>Win</option><option>Loss</option><option>Breakeven</option></select></div><div class="table"><table><thead><tr><th>Market / Setup</th><th>Outcome</th><th>Result</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="app.js"></script></body></html>
