<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow Demo</title><link rel="stylesheet" href="style.css"></head><body><header><a href="../../index.html">← Portfolio</a><h1>TaskFlow <small>TASK MANAGER</small></h1></header><main><p class="eyebrow">PERSONAL WORKSPACE</p><h2>Make progress,<br>one task at a time.</h2><p class="muted">Add tasks, set priority, filter and sort your work. Tasks are saved in this browser.</p><section class="stats"><div>ALL TASKS <b id="all">0</b></div><div>TO DO <b id="todo">0</b></div><div>IN PROGRESS <b id="doing">0</b></div><div>DONE <b id="done">0</b></div></section><form id="form"><input name="title" required placeholder="What needs to get done?"><select name="priority"><option>Medium</option><option>High</option><option>Low</option></select><input name="due" type="date" aria-label="Due date"><button>Add task</button></form><div class="filters"><input id="search" placeholder="Search tasks"><select id="filter"><option value="all">All statuses</option><option>To do</option><option>In progress</option><option>Done</option></select><select id="sort"><option value="new">Newest first</option><option value="priority">High priority first</option><option value="due">Due date first</option></select></div><section id="list"></section></main><script src="app.js"></script></body></html>
