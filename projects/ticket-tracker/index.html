<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportDesk Demo</title><link rel="stylesheet" href="style.css"></head><body><header><a href="../../index.html">← Portfolio</a><h1>SupportDesk <small>IT TICKET TRACKER</small></h1></header><main><p class="eyebrow">HELP DESK WORKSPACE</p><h2>Keep every issue moving.</h2><p class="muted">Create, search, prioritise and update support requests. Data is saved in this browser.</p><section class="stats"><div>OPEN <b id="open">0</b></div><div>IN PROGRESS <b id="progress">0</b></div><div>RESOLVED <b id="resolved">0</b></div><div>TOTAL <b id="total">0</b></div></section><form id="form"><input name="title" required placeholder="Issue title"><input name="requester" required placeholder="Requester"><select name="priority"><option>Medium</option><option>High</option><option>Low</option></select><button>Add ticket</button></form><div class="filters"><input id="search" placeholder="Search tickets"><select id="filter"><option value="all">All statuses</option><option>Open</option><option>In progress</option><option>Resolved</option></select></div><section id="list" aria-live="polite"></section></main><script src="app.js"></script></body></html>
